<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Visualização de Áudio</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Sistema de Visualização de Áudio</h1>
      </header>

      <main>
        <section id="controls">
          <div class="control-group">
            <h3>Audio Control</h3>

            <button id="startMic" class="icon-btn btn-primary">
              <i class="bi bi-mic-fill"></i> Iniciar Microfone
            </button>
            <input type="file" id="audioFile" accept="audio/mp3, audio/wav" />

            <button id="playAudio" class="icon-btn btn-primary" disabled>
              <i class="bi bi-play-circle-fill"></i> Reproduzir Áudio
            </button>

            <button id="stopAudio" class="icon-btn btn-secondary" disabled>
              <i class="bi bi-stop-circle-fill"></i> Parar
            </button>
          </div>

          <div class="control-group">
            <h3>Visualização</h3>
            <select id="visualizationType">
              <option value="spectrum">Espectro de Frequências</option>
              <option value="waveform">Forma de Onda</option>
              <option value="particles">Partículas</option>
            </select>
          </div>

          <div class="control-group">
            <h3>Exportação</h3>
            <button id="exportPNG" class="icon-btn btn-primary">
              <i class="bi bi-image"></i> Exportar PNG
            </button>
            <button id="exportJPEG" class="icon-btn btn-primary">
              <i class="bi bi-save"></i> Exportar JPEG
            </button>
          </div>
        </section>

        <section id="visualization-area">
          <canvas
            id="audioCanvas"
            width="800"
            height="400"
            style="border: 1px solid rgb(0, 0, 0)"
          ></canvas>

          <div id="audioInfo">
            <p id="audioStatus">Áudio: Parado</p>
            <div class="level-container">
              <p id="audioLevel">Nível:</p>
              <div class="level-meter">
                <div class="level-bar"></div>
                <span class="level-text">0%</span>
              </div>
            </div>
          </div>
        </section>

        <section id="colors-panel">
          <h3>Cores</h3>

          <div class="color-control">
            <label for="primaryColor">Cor Primária:</label>
            <input type="color" id="primaryColor" value="#4cc9f0" />
          </div>

          <div class="color-control">
            <label for="secondaryColor">Cor Secundária:</label>
            <input type="color" id="secondaryColor" value="#f72585" />
          </div>

          <div class="color-control">
            <label for="backgroundColor">Cor de Fundo:</label>
            <input type="color" id="backgroundColor" value="#121226" />
          </div>

          <div class="color-control">
            <label for="useGradient">
              <input type="checkbox" id="useGradient" /> Usar Gradiente
            </label>
          </div>

          <div class="color-control">
            <label for="colorByLevel">
              <input type="checkbox" id="colorByLevel" /> Modo Cor
              Primária/Nível Áudio
            </label>
          </div>
        </section>

        <section id="properties-panel">
          <h3>Propriedades da Visualização</h3>
          <div id="properties-container"></div>
        </section>

        <section id="audio-panel">
          <h3>Áudio</h3>
          <div class="sensitivity-control">
            <label for="audioSensitivity"
              >Sensibilidade do Áudio:<span id="sensitivityValue"
                >1.0</span
              ></label
            >
            <input
              type="range"
              id="audioSensitivity"
              min="0.1"
              max="2.0"
              step="0.1"
              value="1.0"
            />
          </div>
        </section>
      </main>

      <div id="errorModal" class="modal hidden">
        <div class="modal-content">
          <span class="close">&times;</span>
          <h3>Erro</h3>
          <p id="errorMessage"></p>
        </div>
      </div>
    </div>

    <script type="module" src="js/App.js"></script>
  </body>
</html>
